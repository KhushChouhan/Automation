# Production topology: provision managed PostgreSQL and Redis 7/8 separately.
# This file intentionally defines no local datastore containers.
x-runtime: &runtime
  build:
    context: .
    dockerfile: Dockerfile
    target: production
  env_file: .env
  environment: &runtime-env
    NODE_ENV: production
    DATABASE_URL: ${DATABASE_URL:?Set the managed PostgreSQL connection URL}
    REDIS_URL: ${REDIS_URL:?Set the shared managed Redis connection URL}
    AUTOMATION_ENABLED: 'false'
    INSTAGRAM_PUBLISHING_ENABLED: 'false'

services:
  migrate:
    <<: *runtime
    command: ['node', 'scripts/start.mjs', 'migrate']
    restart: 'no'

  api:
    <<: *runtime
    command: ['node', 'scripts/start.mjs', 'api']
    restart: unless-stopped
    ports:
      - '127.0.0.1:8000:8000'
    environment:
      <<: *runtime-env
      PORT: '8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    <<: *runtime
    command: ['node', 'scripts/start.mjs', 'worker']
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:8000
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?Set the same private token as the API}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set the dashboard password}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - api
