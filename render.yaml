# Reliable scheduling requires paid always-on processes and persistent datastores.
# Applying this Blueprint provisions billable resources; inspect plans before deployment.
databases:
  - name: reels-postgres
    databaseName: reels_automation
    user: reels_user
    plan: 0.5c-1g
    region: oregon
    ipAllowList: []

envVarGroups:
  - name: reels-runtime
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: DAILY_REEL_LIMIT
        value: '2'
      - key: SAME_FACE_GAP_DAYS
        value: '2'
      - key: SLOT_1
        value: '19:00'
      - key: SLOT_2
        value: '20:00'
      - key: AUTOMATION_ENABLED
        value: 'false'
      - key: INSTAGRAM_PUBLISHING_ENABLED
        value: 'false'
      - key: GOOGLE_DRIVE_ARCHIVE_ENABLED
        value: 'false'
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: GOOGLE_SYNC_INTERVAL_MINUTES
        value: '5'
      # Add provider secrets and resource IDs to this shared secret group only
      # when the corresponding integration is explicitly authorized.

services:
  - type: keyvalue
    name: reels-redis
    region: oregon
    plan: 256mb
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

  - type: web
    name: reels-automation
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node scripts/start.mjs api
    preDeployCommand: node scripts/start.mjs migrate
    plan: 0.5c-512mb
    region: oregon
    healthCheckPath: /health
    envVars:
      - fromGroup: reels-runtime
      - key: PORT
        value: '8000'
      - key: DATABASE_URL
        fromDatabase:
          name: reels-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: reels-redis
          property: connectionString

  - type: worker
    name: reels-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node scripts/start.mjs worker
    preDeployCommand: node scripts/start.mjs migrate
    plan: 0.5c-512mb
    region: oregon
    envVars:
      - fromGroup: reels-runtime
      - key: DATABASE_URL
        fromDatabase:
          name: reels-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: reels-redis
          property: connectionString
