databases:
  - name: reels-postgres
    databaseName: reels_automation
    user: postgres
    plan: free
    ipAllowList: []

services:
  # 100% Free Unified Web Service (Fastify API + Background Automation Worker in 1 Container)
  - type: web
    name: reels-automation
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reels-postgres
          property: connectionString
      # Enter free Redis URL (e.g. from free https://upstash.com)
      - key: REDIS_URL
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: DAILY_REEL_LIMIT
        value: 2
      - key: SAME_FACE_GAP_DAYS
        value: 2
      - key: SLOT_1
        value: 19:00
      - key: SLOT_2
        value: 20:00
      - key: AUTOMATION_ENABLED
        sync: false
      - key: CONTENT_GENERATOR_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: MEDIA_STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: META_AUTH_PATH
        value: facebook_login
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_PAGE_ID
        sync: false
      - key: INSTAGRAM_ACCOUNT_ID
        sync: false
      - key: INSTAGRAM_PUBLISHING_ENABLED
        sync: false
